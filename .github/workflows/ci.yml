name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Fetch PDFium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1

      - name: Fetch PDFium (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/fetch-pdfium.sh

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Render smoke test
        shell: bash
        run: |
          cargo run --release -p pdf-cli -- bench crates/engine/tests/data/sample.pdf --zoom 200

      - name: App smoke test (opens the window, scrolls 300 frames, closes)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: bash
        env:
          KRAKEN_SMOKE_TEST_FRAMES: "300"
        run: cargo run --release -p kraken-pdf -- crates/engine/tests/data/sample.pdf
