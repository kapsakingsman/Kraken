[package]
name = "kraken-pdf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Kraken PDF desktop app."

[dependencies]
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
crossbeam-channel = "0.5.17"
eframe = "0.36.2"
egui = { version = "0.36.2", default-features = false, features = ["bytemuck"] }
pdf-engine = { path = "../engine" }
pdf-view = { path = "../view" }
rfd = "0.17.2"
serde_json = { version = "1.0.151", optional = true }

[target.'cfg(windows)'.dependencies]
# Per-thread CPU times for the idle test (src/threads.rs).
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[features]
# Scripted scenarios for performance tests and CI (see src/automation.rs). Not for users.
automation = ["dep:serde_json", "dep:windows-sys"]
