[package]
name = "pdf-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Owns PDFium on a dedicated thread and renders pages as tiles."

[dependencies]
crossbeam-channel = "0.5.17"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
