[package]
name = "perf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Performance tests: engine and view benchmarks, and perf-runner, which measures the app."

[[bin]]
name = "perf-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pdf-engine = { path = "../engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
toml = "1.1.6"

[dev-dependencies]
criterion = "0.8.2"
pdf-view = { path = "../view" }

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "view"
harness = false
